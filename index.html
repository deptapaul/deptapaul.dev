<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Depta Paul</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 700px;
        }

        .badge {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 999px;

            background: rgba(255,255,255,0.08);

            margin-bottom: 20px;

            font-size: 14px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 72px);
            line-height: 1;
            margin-bottom: 18px;
        }

        .gradient {
            background: linear-gradient(
                90deg,
                #22c55e,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255,255,255,0.75);

            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;

            padding: 14px 22px;

            border-radius: 14px;

            transition: 0.2s ease;

            font-weight: 600;
        }

        .btn-primary {
            background: #22c55e;
            color: #04130a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="badge">
            iOS • Android • Web
        </div>

        <h1>
            Hi, I'm
            <span class="gradient">
                Depta Paul
            </span>
        </h1>

        <p>
            Building polished mobile experiences with
            SwiftUI & Jetpack Compose.
        </p>

        <div class="buttons">

            <a
                href="https://github.com/deptapaul"
                class="btn btn-primary"
            >
                GitHub
            </a>

            <a
                href="#"
                class="btn btn-secondary"
            >
                Contact
            </a>

        </div>

    </div>

</body>
</html>
